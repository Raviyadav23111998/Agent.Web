<div class="login-body">
  <div class="login-container">

    <div class="login-header">
      <div class="logo-icon">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="24" r="22" stroke="url(#grad2)" stroke-width="2.5" fill="none"/>
          <path d="M16 32L24 16L32 32" stroke="url(#grad2)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="24" cy="22" r="3" fill="url(#grad2)"/>
          <defs>
            <linearGradient id="grad2" x1="0" y1="0" x2="48" y2="48">
              <stop offset="0%" stop-color="var(--kendo-color-primary)"/>
              <stop offset="100%" stop-color="var(--kendo-color-primary-hover)"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1 class="brand-name">Reset Password</h1>
      <p class="brand-subtitle">Recover your account access</p>
    </div>

    <div *ngIf="!IsEmailValidated" class="step-form">
      <div class="form-group">
        <div class="input-wrapper">
          <i class="icon-user">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </i>
          <input type="text" [(ngModel)]="UserCode" class="form-control"
                 placeholder="Enter your Username" autofocus />
        </div>
      </div>
      <div class="form-group">
        <button type="button" class="btn-submit" (click)="onSubmit('Next')">
          Send OTP
        </button>
      </div>
    </div>

    <div *ngIf="IsEmailValidated" class="step-form">
      <form [formGroup]="resetForm">

        <div class="form-group">
          <label class="otp-label">Enter OTP</label>
          <div class="pin-group">
            <input type="text" maxlength="1" id="pincode-1" class="pin-input"
                   (keydown)="keydown($event, '1')" (keyup)="keyup($event, '1')" autofocus />
            <input type="text" maxlength="1" id="pincode-2" class="pin-input"
                   (keydown)="keydown($event, '2')" (keyup)="keyup($event, '2')" />
            <input type="text" maxlength="1" id="pincode-3" class="pin-input"
                   (keydown)="keydown($event, '3')" (keyup)="keyup($event, '3')" />
            <input type="text" maxlength="1" id="pincode-4" class="pin-input"
                   (keydown)="keydown($event, '4')" (keyup)="keyup($event, '4')" />
            <input type="text" maxlength="1" id="pincode-5" class="pin-input"
                   (keydown)="keydown($event, '5')" (keyup)="keyup($event, '5')" />
            <input type="text" maxlength="1" id="pincode-6" class="pin-input"
                   (keydown)="keydown($event, '6')" (keyup)="keyup($event, '6')" />
          </div>
          <div class="resend-row">
            <span *ngIf="!resendOTP && counter > 0" class="counter-text">Resend in {{ counter }}s</span>
            <button *ngIf="resendOTP" type="button" class="link-resend" (click)="ResendCode()">Resend OTP</button>
          </div>
        </div>

        <div class="form-group">
          <div class="input-wrapper">
            <i class="icon-lock">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </i>
            <input type="password" formControlName="password" class="form-control"
                   placeholder="New Password" />
          </div>
          <div class="error-text" *ngIf="resetForm.controls['password'].touched && resetForm.controls['password'].errors?.['minlength']">
            Minimum 6 characters required
          </div>
        </div>

        <div class="form-group">
          <div class="input-wrapper">
            <i class="icon-lock">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </i>
            <input type="password" formControlName="confirmpassword" class="form-control"
                   placeholder="Confirm Password" />
          </div>
        </div>

        <div class="form-group">
          <button type="button" class="btn-submit" (click)="onSubmit('Submit')">
            Reset Password
          </button>
        </div>
      </form>
    </div>

    <div class="form-group text-center">
      <a routerLink="/login" class="link-reset">← Back to Sign In</a>
    </div>
  </div>
</div>
