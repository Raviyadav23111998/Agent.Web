<div class="profile-trigger" (click)="toggle()">
  <div class="avatar">{{ initials }}</div>
  <div class="user-info">
    <span class="user-name">{{ displayName }}</span>
    <span class="user-action">{{ roleName || 'Manage account' }}</span>
  </div>
</div>

<div class="profile-popover" *ngIf="isOpen">
  <div class="popover-card">

    <div class="active-account">
      <div class="avatar-lg">{{ initials }}</div>
      <div class="account-info">
        <span class="account-name">{{ displayName }}</span>
        <span class="account-role">{{ roleName }}</span>
      </div>
    </div>

    <div class="account-list" *ngIf="accounts.length > 1">
      <div class="section-label">Switch Account</div>
      <button class="account-item"
              *ngFor="let acc of accounts"
              [class.current]="acc.userId === activeSession?.userId"
              (click)="switchAccount(acc)">
        <div class="mini-avatar">{{ acc.name.charAt(0).toUpperCase() }}</div>
        <div class="item-info">
          <span class="item-name">{{ acc.name }}</span>
          <span class="item-role">{{ acc.role }}</span>
        </div>
        <svg *ngIf="acc.userId === activeSession?.userId"
             width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </button>
    </div>

    <div class="popover-divider"></div>

    <a class="action-btn admin-panel-btn" *ngIf="isAdmin" href="#" (click)="goToAdmin($event)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      <span>Admin Panel</span>
      <svg class="arrow-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </a>

    <button class="action-btn logout-btn" (click)="logout()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span>Sign out</span>
    </button>
  </div>
</div>

<div class="popover-backdrop" *ngIf="isOpen" (click)="close()"></div>
