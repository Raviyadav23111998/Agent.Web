<div class="admin-container">
  <app-page-header title="LLM Configuration"
                   subtitle="Manage the global default language-model settings for your entire workspace.">
    <button type="button" class="btn btn-secondary" (click)="syncOpenRouter()" [disabled]="isLoading">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;vertical-align:middle;">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.92-10.44l5.66-5.66"/>
      </svg>
      Sync OpenRouter Models
    </button>
  </app-page-header>

  <div class="alert warning">
    <div class="alert-icon">⚠️</div>
    <div class="alert-content">
      <strong>Agent-Specific Overrides:</strong>
      Individual Bots and Agents configured with a specific model will override these global defaults. Ensure a Bot's model field is empty if you want it to use these settings.
    </div>
  </div>

  <app-skeleton *ngIf="isLoading" [rows]="3"></app-skeleton>

  <div class="content-section" *ngIf="!isLoading">
    <div class="tab-content">
      <form [formGroup]="llmForm" (ngSubmit)="saveConfig()">

        <div class="form-row">
          <div class="form-group">
            <label for="provider">Global Provider</label>
            <select id="provider" formControlName="provider" class="premium-select"
                    [class.is-invalid]="llmForm.get('provider')?.invalid && llmForm.get('provider')?.touched">
              <option value="">-- Select Provider --</option>
              <option *ngFor="let opt of providerOptions" [value]="opt.code">{{ opt.englishName || opt.english_name || opt.code }}</option>
            </select>
            <small class="field-error" *ngIf="llmForm.get('provider')?.invalid && llmForm.get('provider')?.touched">Select a provider.</small>
          </div>

          <div class="form-group">
            <label for="model">Default Model</label>
            <select id="model" formControlName="model" class="premium-select"
                    [class.is-invalid]="llmForm.get('model')?.invalid && llmForm.get('model')?.touched">
              <option value="">-- Select Model --</option>
              <option *ngFor="let opt of filteredModels" [value]="opt.code">{{ opt.englishName || opt.english_name || opt.code }}</option>
            </select>
            <small class="field-error" *ngIf="llmForm.get('model')?.invalid && llmForm.get('model')?.touched">Select a model.</small>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="base_url">Base URL</label>
            <input type="url" id="base_url" formControlName="base_url" placeholder="https://api.openai.com/v1" />
          </div>

          <div class="form-group">
            <label for="api_key">API Key</label>
            <div class="secret-input-wrapper">
              <input type="password" id="api_key" formControlName="api_key" placeholder="Enter new API key (leave blank to keep current)" />
              <span class="lock-icon">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
            </div>
          </div>
        </div>

        <div class="form-row three-cols">
          <div class="form-group">
            <label for="provider_order">Provider Fallback Order</label>
            <input type="text" id="provider_order" formControlName="provider_order" placeholder="e.g. DeepInfra, OpenRouter" />
          </div>

          <div class="form-group">
            <label for="max_tokens">Max Tokens</label>
            <input type="number" id="max_tokens" formControlName="max_tokens" placeholder="16000" />
          </div>

          <div class="form-group">
            <label for="temperature">Temperature</label>
            <input type="number" step="0.1" min="0" max="2" id="temperature" formControlName="temperature" placeholder="0.7" />
          </div>
        </div>

        <div class="notification success-alert" *ngIf="successMessage">
          <span class="icon">✅</span> {{ successMessage }}
        </div>
        <div class="notification error-alert" *ngIf="errorMessage">
          <span class="icon">❌</span> {{ errorMessage }}
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary" [disabled]="llmForm.invalid || isSaving">
            <span *ngIf="!isSaving">Save & Hot-Reload</span>
            <span *ngIf="isSaving">Saving...</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
