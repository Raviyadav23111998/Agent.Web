name: Build & Deploy

# main → ai.storeglance.com (prod), uat → uat-ai.storeglance.com (uat).
#
# Repository secrets: DEPLOY_HOST, SSH_DEPLOY_KEY, SSH_KNOWN_HOSTS (see Agent.API).
# Optional: KENDO_UI_LICENSE — your Kendo UI license key; without it the build
# still succeeds but Kendo components show a license notice.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [ "main", "uat" ]
  pull_request:
    branches: [ "main", "uat" ]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    name: Angular Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Resolve environment
        id: env
        run: |
          case "${GITHUB_BASE_REF:-${GITHUB_REF#refs/heads/}}" in
            main) echo "config=production" >> "$GITHUB_OUTPUT"; echo "host=ai.storeglance.com"     >> "$GITHUB_OUTPUT" ;;
            *)    echo "config=uat"        >> "$GITHUB_OUTPUT"; echo "host=uat-ai.storeglance.com" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build
        env:
          KENDO_UI_LICENSE: ${{ secrets.KENDO_UI_LICENSE }}
        run: npx ng build --configuration ${{ steps.env.outputs.config }}

      - name: Deploy
        if: github.event_name != 'pull_request'
        env:
          KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          KNOWN: ${{ secrets.SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          SITE: ${{ steps.env.outputs.host }}
        run: |
          d="$RUNNER_TEMP/ssh"; mkdir -p "$d" && chmod 700 "$d"
          printf '%s\n' "$KEY"   > "$d/key";  chmod 600 "$d/key"
          printf '%s\n' "$KNOWN" > "$d/known_hosts"
          O="-i $d/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$d/known_hosts -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20"
          tar -czf - -C dist/agent.web/browser . | ssh $O "root@$HOST" "set -e
            R=/var/www/$SITE
            rm -rf \$R/web.next && mkdir -p \$R/web.next && tar -xzf - -C \$R/web.next
            test -f \$R/web.next/index.html
            chmod -R a+rX \$R/web.next
            rm -rf \$R/web.previous; [ -d \$R/web ] && mv \$R/web \$R/web.previous; mv \$R/web.next \$R/web"
          rm -rf "$d"
          echo "Deployed web to $SITE"
